name: Пульс ИИ — обновление новостей

on:
  workflow_dispatch:
    inputs:
      since:
        description: Начальная дата поиска YYYY-MM-DD, необязательно
        type: string
        required: false
      topic:
        description: Тема выпуска
        type: choice
        default: Все темы
        options:
          - Все темы
          - Подробные новости ИИ
          - Прогноз экономики при быстром развитии ИИ
          - Развитие мышления ИИ образами
          - Пересборка прогноза 2026–2050
          - Новости GPT
          - Гипербола технологий Капицы с ИИ
          - Прогноз беспилотных авто
          - Пять технологических прорывов
  schedule:
    - cron: '0 */6 * * *'

permissions:
  id-token: write
  contents: write

concurrency:
  group: pulse-ii-news
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'DPProekt/Nov_II' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENAI_IDENTITY_PROVIDER_ID: ${{ vars.PULSE_OPENAI_IDENTITY_PROVIDER_ID }}
      OPENAI_SERVICE_ACCOUNT_ID: ${{ vars.PULSE_OPENAI_SERVICE_ACCOUNT_ID }}
      PULSE_GITHUB_VAULT_ID: ${{ vars.PULSE_GITHUB_VAULT_ID }}
      PULSE_CREDITS_UNTIL_UTC: ${{ vars.PULSE_CREDITS_UNTIL_UTC }}
      PULSE_SEARCH_TOPIC: ${{ inputs.topic }}
      PULSE_SEARCH_SINCE: ${{ inputs.since }}
    steps:
      - name: Сохранить текущую аналитику и подготовить выпуск
        env:
          PULSE_GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          from collections import Counter
          from datetime import date, datetime, timedelta, timezone
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode, urlsplit
          from urllib.request import Request, urlopen

          def request(url, label, *, token=None, data=None, headers=None, timeout=30, method=None, missing_ok=False):
              request_headers = {"User-Agent": "Pulse-II-News", **(headers or {})}
              if token:
                  request_headers["Authorization"] = "Bearer " + token
              if data is not None:
                  request_headers["Content-Type"] = "application/json"
                  data = json.dumps(data).encode()
              try:
                  return urlopen(Request(url, data, request_headers, method=method), timeout=timeout)
              except HTTPError as error:
                  if missing_ok and error.code == 404:
                      return None
                  detail = ""
                  if url.startswith(("https://auth.openai.com/", "https://api.openai.com/")):
                      try:
                          reply = json.load(error)
                          error_info = reply.get("error")
                          kind = error_info.get("code") if isinstance(error_info, dict) else error_info
                          if kind in {"invalid_grant", "invalid_subject_token", "invalid_request", "unauthorized_client", "access_denied", "unsupported_grant_type", "invalid_client"}:
                              detail = f" ({kind})"
                          description = str(error_info.get("message", "") if isinstance(error_info, dict) else reply.get("error_description", "")).lower()
                          param = error_info.get("param") if isinstance(error_info, dict) else None
                          if isinstance(param, str) and re.fullmatch(r"[a-z.0-9_\[\]-]{1,64}", param):
                              detail += f" [param: {param}]"
                          scopes = sorted(set(re.findall(r"\bapi\.[a-z_.]+[a-z_]\b", description)))
                          if scopes:
                              detail += " [permissions: " + ", ".join(scopes) + "]"
                          hints = ("provider", "mapping", "service account", "audience", "issuer", "signature", "expired", "subject token", "scope", "project", "permission", "api key", "jwt", "access token", "authorization", "invalid", "missing", "required", "credentials", "environment", "input", "model", "agent", "mcp", "vault", "not found", "configuration")
                          found = [hint for hint in hints if hint in description]
                          if found:
                              detail += " [" + ", ".join(found) + "]"
                      except (ValueError, TypeError, AttributeError):
                          pass
                  raise SystemExit(f"{label}: HTTP {error.code}{detail}") from None
              except (URLError, TimeoutError):
                  raise SystemExit(f"{label}: ошибка соединения") from None

          def get_json(url, label, **kwargs):
              response = request(url, label, **kwargs)
              if response is None:
                  return None
              with response:
                  return json.load(response)

          def read_archive():
              result = get_json(
                  "https://api.github.com/repos/DPProekt/Nov_II/contents/news.json?ref=main",
                  "Чтение архива GitHub",
                  headers={"Accept": "application/vnd.github.raw+json", "Cache-Control": "no-cache"},
              )
              return result

          def canonical_topic(topic):
              return {
                  "Новости ИИ": "Подробные новости ИИ",
                  "Новости ИИ подробно": "Подробные новости ИИ",
                  "Прогноз экономики ИИ": "Прогноз экономики при быстром развитии ИИ",
              }.get(topic, topic)

          def version_key(review):
              updated = datetime.fromisoformat(review["updated_at"])
              if updated.utcoffset() is None:
                  raise ValueError("У версии аналитики не указан часовой пояс.")
              return canonical_topic(review["topic"]), updated.astimezone(timezone.utc)

          def article_sources(item):
              candidates = [item.get("url")]
              candidates.extend(ref.get("url") for ref in (item.get("references") or []) if isinstance(ref, dict))
              result = set()
              for url in candidates:
                  if not isinstance(url, str):
                      continue
                  parsed = urlsplit(url)
                  if parsed.scheme == "https" and parsed.hostname and not parsed.username and not parsed.password:
                      result.add(url)
              return result

          def verify_reviews(previous_archive, archive, added, selected_topics):
              previous = {review["topic"]: review for review in previous_archive.get("analysis", [])}
              reviews = {review["topic"]: review for review in archive.get("analysis", [])}
              if previous.keys() - reviews.keys():
                  raise SystemExit("В выпуске исчез прежний аналитический обзор.")
              primary_topics = {item["topic"] for item in added}
              changed_topics = {topic for topic, review in reviews.items() if review != previous.get(topic)}
              new_sources = set().union(*(article_sources(item) for item in added))
              known_sources = set().union(*(article_sources(item) for item in archive["items"]))
              known_sources.update(url for review in previous.values() for url in review.get("sources", []))
              for topic in sorted(primary_topics | changed_topics):
                  review = reviews.get(topic, {})
                  prior = previous.get(topic)
                  if not all(review.get(field) for field in ("updated_at", "changes", "conclusion")) or (
                      prior and version_key(review)[1] <= version_key(prior)[1]
                  ):
                      raise SystemExit(f"Отсутствует обновлённый аналитический обзор: {topic}.")
                  details = review.get("details", [])
                  if len(details) < 2 or not all(section.get("heading") and section.get("text") for section in details):
                      raise SystemExit(f"Аналитика темы должна содержать подробные разделы: {topic}.")
                  urls = set(review.get("sources", []))
                  if not urls or urls - known_sources:
                      raise SystemExit(f"Обзор содержит ссылки вне архива материалов: {topic}.")
                  earlier = set(prior.get("sources", [])) if prior else set()
                  if not (urls - earlier) & new_sources:
                      raise SystemExit(f"В обновлённом обзоре нет источника из нового выпуска: {topic}.")

          def save_reviews(archive):
              url = "https://api.github.com/repos/DPProekt/Nov_II/contents/analysis-history.json"
              token = os.environ["PULSE_GITHUB_TOKEN"]
              headers = {"Accept": "application/vnd.github+json", "Cache-Control": "no-cache"}
              file = get_json(url + "?ref=main", "Чтение архива аналитики", headers=headers, token=token, missing_ok=True)
              if file is None:
                  history = {"schema_version": 1, "versions": []}
              elif file.get("encoding") == "base64":
                  history = json.loads(base64.b64decode(file["content"]))
              else:
                  history = get_json(
                      url + "?ref=main", "Чтение архива аналитики",
                      headers={**headers, "Accept": "application/vnd.github.raw+json"}, token=token,
                  )
              if history.get("schema_version") != 1 or not isinstance(history.get("versions"), list):
                  raise SystemExit("Формат архива аналитики не распознан.")
              versions = history["versions"]
              retained = {version_key(review) for review in versions}
              publications = {}
              seen = set()
              for item in archive["items"]:
                  topic = canonical_topic(item["topic"])
                  day = date.fromisoformat(item["date"]).isoformat()
                  key = (topic, item["url"])
                  if key not in seen:
                      publications.setdefault(topic, Counter())[day] += 1
                      seen.add(key)

              count = 0
              for review in archive.get("analysis", []):
                  key = version_key(review)
                  if key not in retained:
                      versions.append({**review, "topic": key[0], "publication_dates": publications.get(key[0], {})})
                      retained.add(key)
                      count += 1
              if not count:
                  print("Архив аналитики уже содержит текущие версии.")
                  return
              payload = {
                  "branch": "main",
                  "message": "Сохранить версии аналитики перед обновлением",
                  "content": base64.b64encode((json.dumps(history, ensure_ascii=False, indent=2) + "\n").encode()).decode(),
              }
              if file is not None:
                  payload["sha"] = file["sha"]
              get_json(url, "Запись архива аналитики", headers=headers, token=token, data=payload, method="PUT")
              print(f"Сохранено версий аналитики: {count}.")

          cutoff_value = os.environ.get("PULSE_CREDITS_UNTIL_UTC")
          if not cutoff_value:
              raise SystemExit("Укажите срок подтверждённых кредитов PULSE_CREDITS_UNTIL_UTC.")
          cutoff = datetime.fromisoformat(cutoff_value)
          if cutoff.utcoffset() != timedelta(0):
              raise SystemExit("Срок кредитов должен быть указан в UTC.")
          if datetime.now(timezone.utc) + timedelta(minutes=8) >= cutoff:
              print("Срок подтверждённых кредитов подошёл к концу. OpenAI API не вызывался.")
              raise SystemExit(0)

          provider = os.environ.get("OPENAI_IDENTITY_PROVIDER_ID")
          account = os.environ.get("OPENAI_SERVICE_ACCOUNT_ID")
          vault = os.environ.get("PULSE_GITHUB_VAULT_ID")
          if not provider or not account or not vault:
              raise SystemExit("Добавьте идентификаторы провайдера, сервисного аккаунта и хранилища GitHub.")

          old_archive = read_archive()
          save_reviews(old_archive)
          old_items = old_archive["items"]
          oidc_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in oidc_url else "?"
          github_token = get_json(
              oidc_url + separator + urlencode({"audience": "urn:openai:dpproekt:nov-ii"}),
              "Идентификация GitHub",
              token=os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"],
          )["value"]
          encoded_claims = github_token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(encoded_claims + "=" * (-len(encoded_claims) % 4)))
          expected_claims = {
              "iss": "https://token.actions.githubusercontent.com",
              "aud": "urn:openai:dpproekt:nov-ii",
              "repository_id": "1458024428",
              "ref": "refs/heads/main",
              "workflow_ref": "DPProekt/Nov_II/.github/workflows/pulse-news.yml@refs/heads/main",
          }
          mismatch = [name for name, expected in expected_claims.items() if claims.get(name) != expected]
          if mismatch:
              raise SystemExit("GitHub OIDC: не совпадают поля " + ", ".join(mismatch))
          print("GitHub OIDC: назначение, репозиторий, ветка и workflow совпадают.")
          openai_token = get_json(
              "https://auth.openai.com/oauth/token",
              "Обмен токена OpenAI",
              data={
                  "grant_type": "urn:ietf:params:oauth:grant-type:token-exchange",
                  "subject_token_type": "urn:ietf:params:oauth:token-type:jwt",
                  "subject_token": github_token,
                  "identity_provider_id": provider,
                  "service_account_id": account,
              },
          )["access_token"]

          topics = {
              "Подробные новости ИИ": "новые модели искусственного интеллекта, исследования, оценки и реальные внедрения",
              "Прогноз экономики при быстром развитии ИИ": "AI economic impact, производительность, стоимость внедрения и подтверждённая отдача",
              "Развитие мышления ИИ образами": "AI visual reasoning, world models, пространственное планирование и визуальная память моделей",
              "Пересборка прогноза 2026–2050": "AI long-term outlook, измеримые сигналы, которые меняют допущения долгосрочного прогноза",
              "Новости GPT": "новые модели, продукты, системные карты и инструменты OpenAI",
              "Гипербола технологий Капицы с ИИ": "AI scaling, сопоставимые временные ряды стоимости, качества и внедрения технологий",
              "Прогноз беспилотных авто": "autonomous vehicles, испытания, безопасность, допуски и действующие пассажирские сервисы",
              "Пять технологических прорывов": "проверенные технологические вехи в ИИ, автономных системах, энергетике, биомедицине и квантовых вычислениях",
          }
          requested_topic = os.environ.get("PULSE_SEARCH_TOPIC", "")
          search_since = os.environ.get("PULSE_SEARCH_SINCE", "").strip()
          if search_since:
              try:
                  since_date = date.fromisoformat(search_since)
              except ValueError:
                  raise SystemExit("Начальная дата должна быть указана как YYYY-MM-DD.") from None
              if since_date.isoformat() != search_since or since_date > datetime.now(timezone.utc).date():
                  raise SystemExit("Некорректная начальная дата поиска.")
          if requested_topic and requested_topic != "Все темы":
              if requested_topic not in topics:
                  raise SystemExit("Неизвестная тема выпуска.")
              topics = {requested_topic: topics[requested_topic]}
          print("Темы выпуска: " + ", ".join(topics))
          search_plan = "\n".join(
              f"Первый веб-запрос: {topic}\nУточнения для дополнительных запросов: {context}"
              for topic, context in topics.items()
          )
          interval_instruction = (
              f"Ищи пропущенные существенные материалы с {search_since} по текущий момент. "
              "Для каждой темы проверь диапазон целиком, используя несколько поисковых запросов. "
              if search_since else
              "Ищи публикации за последние шесть часов с небольшим перекрытием. "
              "Отдельно проверяй ранее пропущенные, но обнаруженные сейчас важные материалы последних семи дней. "
          )
          prompt = (
              "Подготовь выпуск Пульса ИИ по всем перечисленным темам.\n"
              "Для каждой темы выполни реальный веб-поиск с её названием целиком. "
              "В строку поиска передавай только текст после Первый веб-запрос, без кавычек "
              "любого вида и без операторов точного совпадения. Запросы по темам можно выполнять параллельно. "
              "ИИ и AI означают искусственный интеллект (artificial intelligence). "
              "Если выдача расплывчата, выполни дополнительные запросы без кавычек с предметными терминами "
              "на русском или английском. "
              f"{interval_instruction}"
              "При их включении укажи исходную дату публикации и поясни, что материал добавлен к этому выпуску.\n"
              f"{search_plan}\n"
              "Открывай подходящие результаты и отбирай по содержанию. Статья должна сообщать новый факт, "
              "исследование или объявление, которые помогают ответить на вопрос темы. Совпадение названия "
              "или всех слов в заголовке и тексте статьи не требуется. Для темы мышления ИИ образами "
              "исключай материалы об образном мышлении человека без результата, относящегося к ИИ. "
              "Если найден только общий фон, оставь тему без новости. "
              "После первичного поиска сделай проверку кандидатов через сайт разработчика, статью авторов, "
              "официальный реестр, документацию или отчёт. Проверяй дату публикации и дату события отдельно, "
              "условия доступности, статус результата и область, в которой он доказан. "
              "Сверяй метрику, состав выборки и единицы измерения. В спорных случаях ищи независимое подтверждение. "
              "Сопоставь результаты с последним выпуском в news.json. Не добавляй повторные сообщения о событии, "
              "если нового существенного факта нет. Убирай ссылки с параметрами отслеживания. "
              "Используй канонические названия тем из первых запросов. "
              "Формулируй карточку как полезный самостоятельный ответ GPT по теме: "
              "сохраняй публичный вопрос в question, ответ с проверенными фактами в summary и точную ссылку в url. "
              "В brief дай одну короткую фразу с главным изменением для начала выпуска. "
              "Пометь importance как high у ключевых подтверждённых событий, остальные как normal. "
              "В analysis объясни значение результата для темы, отделяя факт от оценки. В watch укажи, "
              "какую ближайшую проверку, публикацию или веху имеет смысл отслеживать. "
              "Если первоисточник даёт сопоставимые цифры, добавь comparison как объект с caption, "
              "columns (2–5 строковых заголовков с единицами) и rows (2–8 строк с одинаковым числом "
              "строковых ячеек). В caption укажи условия и ограничения сравнения. "
              "При отсутствии сравнимых данных не добавляй comparison. "
              "По необходимости добавляй references как массив объектов с title и url для дополнительных "
              "проверенных источников. Показывай ответ на вопрос о новом событии. "
              "Не создавай карточку из общего фонового обзора. "
              "Обновляй только news.json в main DPProekt/Nov_II. Сохрани все прежние записи. "
              "Под каждой новостью должна быть прямая HTTPS-ссылка на статью. При наличии "
              "только даты оставляй published_at равным null. У каждой новой записи добавь поле analysis "
              "с выводом и пределами применимости. Канонические названия для общих новостей и "
              "экономики: Подробные новости ИИ и Прогноз экономики при быстром развитии ИИ. "
              "Сопоставь новые факты с прежним обзором и "
              "обнови верхнеуровневый массив analysis в том же news.json для затронутых тем. "
              "Формат элемента массива: topic, updated_at в ISO 8601 UTC, changes (что изменилось), "
              "conclusion (вывод и оговорки), details (минимум два раздела с heading и text, включая "
              "факты, пределы данных и что изменит оценку), sources (прежние проверенные "
              "ссылки и новые прямые URL из items), source_titles (заголовки источников). "
              "Если новость существенно меняет вывод другой выбранной темы, можно обновить и этот обзор: "
              "объясни связь и добавь в его sources прямую ссылку на новую статью или её проверенный первоисточник "
              "из references. Сохрани без изменений обзоры, для которых новых источников нет. "
              "Сохрани новости и аналитику одним коммитом. "
              "После записи проверь её повторным "
              "чтением и ответь PULSE_PUBLISHED. Если подтверждённых новых материалов нет, "
              "ничего не меняй и ответь PULSE_NO_NEWS. При ошибке опиши её и ответь PULSE_ERROR."
          )
          messages = []
          event_data = []
          completed = False
          headers = {
              "OpenAI-Beta": "agents=v1",
              "OpenAI-Project": "proj_2yk5sqnjXZpYTzF9fngNiYB0",
              "Accept": "text/event-stream",
          }
          with request(
              "https://api.openai.com/v1/agents/sessions",
              "Запуск агента OpenAI",
              token=openai_token,
              headers=headers,
              data={
                  "agent_id": "agent_6afa24e65b40819189c54aeef04a7989",
                  "environment": {"type": "none"},
                  "vault_ids": [vault],
                  "input": prompt,
                  "stream": True,
              },
              timeout=240,
          ) as stream:
              for raw_line in stream:
                  line = raw_line.decode().rstrip("\r\n")
                  if line.startswith("data:"):
                      event_data.append(line[5:].lstrip(" "))
                  if line or not event_data:
                      continue
                  raw_event = "\n".join(event_data)
                  event_data.clear()
                  if raw_event == "[DONE]":
                      break
                  event = json.loads(raw_event)
                  event_type = event.get("type")
                  if event_type == "agent.session.turn.output_text.done":
                      messages.append(event.get("text", ""))
                  if event_type in {"agent.session.turn.failed", "agent.session.turn.cancelled", "error"}:
                      raise SystemExit(f"Агент завершил выпуск с ошибкой: {event_type}")
                  if event_type == "agent.session.turn.completed":
                      completed = True
                      break

          if not completed:
              raise SystemExit("OpenAI не подтвердил завершение выпуска.")
          new_archive = read_archive()
          new_items = new_archive["items"]
          if any(item not in new_items for item in old_items):
              raise SystemExit("Архив изменился: прежние записи не сохранились в исходном виде.")
          added = [item for item in new_items if item not in old_items]
          report = "\n".join(messages)
          markers = re.findall(r"\bPULSE_(?:NO_NEWS|PUBLISHED|ERROR)\b", report)
          final_status = markers[-1] if markers else ""
          if final_status == "PULSE_ERROR":
              diagnostic = re.sub(r"(?i)(?:sk-[a-z0-9_-]+|github_pat_[a-z0-9_]+|gh[pousr]_[a-z0-9_]+|bearer\s+\S+)", "[скрыто]", report)
              print("Ответ агента:", diagnostic[-1200:])
              raise SystemExit("Агент сообщил об ошибке публикации.")
          if not added and final_status != "PULSE_NO_NEWS":
              raise SystemExit("Новых записей нет и агент не подтвердил отсутствие новостей.")
          for item in added:
              if not isinstance(item.get("question"), str) or not item["question"].strip():
                  raise SystemExit("В новой карточке отсутствует вопрос к GPT.")
              if not isinstance(item.get("analysis"), str) or not item["analysis"].strip():
                  raise SystemExit("У новой записи отсутствует аналитический вывод.")
              url = urlsplit(item.get("url", ""))
              if url.scheme != "https" or not url.hostname or not item.get("source"):
                  raise SystemExit("У новой записи отсутствует корректная ссылка на источник.")
          verify_reviews(old_archive, new_archive, added, topics)
          print(f"Выпуск окончен. Новых записей в GitHub: {len(added)}.")
          PY

